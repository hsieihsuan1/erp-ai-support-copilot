<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ERP Support Copilot</title><link rel="stylesheet" href="widget.css">
<body><header><span class="tag">LOCAL SYNTHETIC DEMO</span><h1>ERP Support Copilot</h1><p>Runbook guidance inside the ERP screen</p></header>
<main><div class="controls"><label>Demo identity<select id="identity"><option value="alpha-agent">Alpha / agent</option><option value="alpha-reviewer">Alpha / reviewer</option><option value="beta-agent">Beta / agent</option></select></label><label>Module<select id="module"><option>Payables</option><option>Procurement</option><option>Other</option></select></label></div>
<div class="notice">No LLM, cloud database or live ticket provider. All records are synthetic.</div><section id="conversation" aria-live="polite"><p class="empty">Choose a sandbox error and ask for guidance.</p></section>
<form id="chat"><label for="message">Message to review before sending</label><textarea id="message" maxlength="2000" required>How do I handle invoice validation error DEMO-AP-001?</textarea><button id="send">Get runbook guidance</button></form>
<details><summary>Review transcript before escalation</summary><pre id="transcript">No messages yet.</pre></details><label class="confirmation"><input type="checkbox" id="confirmed"> I reviewed the transcript for this mock ticket</label><div class="tickets"><select id="provider" aria-label="Mock ticket provider"><option value="servicenow">ServiceNow mock</option><option value="jira">Jira mock</option></select><button type="button" id="ticket" disabled>Create mock ticket</button></div><p id="ticket-result" role="status"></p><p id="error" role="alert"></p>
</main><script src="widget.js"></script></body></html>
